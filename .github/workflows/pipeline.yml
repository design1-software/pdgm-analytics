name: pipeline

# Regenerates every extract and figure from source and fails if the result
# differs from what is committed. Nothing is pushed back -- a green run is a
# claim that the committed outputs are exactly what this code produces from
# this data, which is the property that makes them worth publishing.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # Order matters: make_figures reads the CSVs that intake_quality writes.
      - name: Regenerate extracts and figures
        run: |
          python src/build_cms_extracts.py
          python src/intake_quality.py
          python src/make_synthetic_cohort.py
          python src/make_figures.py

      # The PNG is excluded from byte-comparison, and only the PNG.
      #
      # The SVG is vector: its glyph outlines and coordinates are computed from
      # the vendored font file, so it reproduces byte-for-byte across macOS and
      # Linux -- verified, this job's first run matched it exactly while the
      # PNG differed (253,280 vs 288,208 bytes). The PNG is a rasterization of
      # that same figure, and rasterization depends on the FreeType build,
      # which differs between platforms.
      #
      # Verifying the SVG is therefore sufficient to prove the *content*
      # reproduces. The PNG can only differ in how identical geometry was
      # rendered to pixels, and both files are written in the same run from the
      # same figure object, so they cannot drift apart in content.
      - name: Fail if any output drifted from what is committed
        run: |
          if [ -n "$(git status --porcelain -- outputs/ ':!outputs/figures/*.png')" ]; then
            echo "::error::Regenerated outputs differ from the committed ones."
            echo "Run the four scripts in src/ locally and commit the result."
            echo
            git status --short -- outputs/ ':!outputs/figures/*.png'
            echo
            # Figures are binary; a textual diff is only useful for the CSVs.
            git diff --stat -- outputs/ ':!outputs/figures/*.png'
            git diff -- outputs/tableau/ outputs/synthetic/ | head -100
            exit 1
          fi
          echo "All extracts, the SVG figure, and the synthetic cohort reproduce exactly."

      # Uploaded regardless, so a drift failure can be inspected visually
      # rather than argued about from a byte count.
      - name: Upload regenerated figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: outputs/figures/
          retention-days: 14
